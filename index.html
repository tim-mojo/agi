<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGI – Design Review</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: #07080f;
      color: rgba(255,255,255,0.9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Glow bg ── */
    body::before {
      content: "";
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 900px; height: 900px;
      background: radial-gradient(ellipse, rgba(124,58,237,0.18) 0%, transparent 65%);
      pointer-events: none;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      padding: 40px 24px;
    }
    .screen.visible { display: flex; }

    /* ── Logo ── */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logo-mark {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #f97316);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-name {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .logo-sub {
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    /* ── Login box ── */
    .login-box {
      background: #0f1120;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      display: block;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: #181a2e;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-family: inherit;
      color: rgba(255,255,255,0.9);
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #7c3aed; }

    .login-btn {
      width: 100%;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #a855f7; }

    .login-error {
      font-size: 13px;
      color: #f87171;
      text-align: center;
      min-height: 18px;
    }

    /* ── Choice screen ── */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    .choice-card {
      background: #0f1120;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
    }

    .choice-card:hover {
      border-color: rgba(124,58,237,0.5);
      background: #131528;
      transform: translateY(-3px);
    }

    .choice-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .choice-card:nth-child(1) .choice-icon { background: rgba(255,255,255,0.06); }
    .choice-card:nth-child(2) .choice-icon { background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(249,115,22,0.2)); }

    .choice-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    .choice-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
    }

    .choice-desc {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      line-height: 1.6;
    }

    .choice-arrow {
      margin-top: auto;
      padding-top: 24px;
      font-size: 20px;
      color: rgba(255,255,255,0.2);
      transition: color 0.2s;
    }
    .choice-card:hover .choice-arrow { color: #a855f7; }

    .signout {
      font-size: 13px;
      color: rgba(255,255,255,0.25);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s;
    }
    .signout:hover { color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div class="screen visible" id="login-screen">
  <div class="logo">
    <div class="logo-mark">AGI</div>
    <div>
      <div class="logo-name">Applied General Intelligence</div>
      <div class="logo-sub" style="text-align:center;margin-top:6px">Design Review Portal</div>
    </div>
  </div>

  <form class="login-box" onsubmit="doLogin(event)">
    <div>
      <label>Password</label>
      <input type="password" id="pw" placeholder="Enter access password" autocomplete="current-password" />
    </div>
    <div class="login-error" id="login-error"></div>
    <button type="submit" class="login-btn">Access Portal</button>
  </form>
</div>

<!-- ── CHOICE ── -->
<div class="screen" id="choice-screen">
  <div class="logo">
    <div class="logo-mark">AGI</div>
    <div>
      <div class="logo-name">Applied General Intelligence</div>
      <div class="logo-sub" style="text-align:center;margin-top:6px">Design Review Portal</div>
    </div>
  </div>

  <div class="choices">
    <a class="choice-card" href="wireframes/index.html" target="_blank">
      <div class="choice-icon">⬜</div>
      <div class="choice-label">Version 1</div>
      <div class="choice-title">Wireframes</div>
      <div class="choice-desc">Low-fidelity structure and layout for all pages.</div>
      <div class="choice-arrow">→</div>
    </a>

    <a class="choice-card" href="colormocks/index.html" target="_blank">
      <div class="choice-icon">🎨</div>
      <div class="choice-label">Version 2</div>
      <div class="choice-title">Color Mocks</div>
      <div class="choice-desc">High-fidelity designs with the full AGI color palette applied.</div>
      <div class="choice-arrow">→</div>
    </a>
  </div>

  <button class="signout" onclick="doLogout()">Sign out</button>
</div>

<script>
  const PASSWORD = "agi2026";

  function doLogin(e) {
    e.preventDefault();
    if (document.getElementById("pw").value === PASSWORD) {
      sessionStorage.setItem("agi-auth", "1");
      show("choice-screen");
    } else {
      const err = document.getElementById("login-error");
      err.textContent = "Incorrect password. Try again.";
      setTimeout(() => err.textContent = "", 3000);
    }
  }

  function doLogout() {
    sessionStorage.removeItem("agi-auth");
    show("login-screen");
    document.getElementById("pw").value = "";
  }

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("visible"));
    document.getElementById(id).classList.add("visible");
  }

  if (sessionStorage.getItem("agi-auth") === "1") show("choice-screen");
</script>
</body>
</html>
